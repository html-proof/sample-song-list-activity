# ─── Recommendation cache ─────────────────────────────────────────────────────

mutation UpsertRecommendationCache(
  $userId: String!
  $songId: UUID!
  $score: Float!
  $reasonArtist: Float
  $reasonGenre: Float
  $reasonLanguage: Float
  $reasonHistory: Float
  $reasonTrending: Float
) @auth(level: USER_EMAIL_VERIFIED, insecureReason: "Called only by the FastAPI backend service account") {
  recommendationCache_insert(data: {
    userId:          $userId
    song:            { id: $songId }
    score:           $score
    reasonArtist:    $reasonArtist
    reasonGenre:     $reasonGenre
    reasonLanguage:  $reasonLanguage
    reasonHistory:   $reasonHistory
    reasonTrending:  $reasonTrending
  })
}

mutation ClearRecommendationCache($userId: String!) @auth(level: USER_EMAIL_VERIFIED, insecureReason: "Called only by the FastAPI backend service account") {
  recommendationCache_deleteMany(where: { userId: { eq: $userId } })
}
