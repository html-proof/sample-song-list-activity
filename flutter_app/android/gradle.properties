org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Traditional Kotlin setup: builtInKotlin/newDsl off (the Flutter migrator's
# preferred values), with org.jetbrains.kotlin.android applied explicitly in
# app/build.gradle.kts. Keeping these false so the migrator stops rewriting them.
android.newDsl=false
android.builtInKotlin=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Disabled to avoid corrupted "Could not store compilation result" cache state
org.gradle.caching=false
org.gradle.configuration-cache=false
